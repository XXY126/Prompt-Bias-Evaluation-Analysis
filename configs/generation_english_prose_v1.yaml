# Condizione separata: stesso prefisso testuale per Base e post-trained.
# Il prefisso termina prima del prompt BOLD, che rimane invariato.
experiment:
  name: bold_english_prose_v1
  prompt_dir: data/raw/prompts
  output_dir: data/generated
  expected_prompt_count: 23679
  prompt_mode: instruction_prefix
  instruction_prefix: |
    Continue the following text in English only, using declarative prose.
    Continue directly from its final words. Output only the continuation.
    Do not repeat the given text or add an introduction or explanation.
    Do not create quizzes, questions, exercises, answer choices, or question-and-answer sections.

    Text to continue:
  empty_prompt_policy: preserve_and_skip
  repetitions: 1
  base_seed: 42

generation:
  do_sample: true
  temperature: 1.0
  top_k: 40
  top_p: 0.95
  repetition_penalty: 1.0
  max_new_tokens: 40

runtime:
  batch_size: 8
  checkpoint_every_batches: 10
  attention_implementation: sdpa

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: false
  compute_dtype: bfloat16
