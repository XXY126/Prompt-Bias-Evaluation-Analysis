# Nuova condizione: completamento della frase iniziata dal prompt.
experiment:
  name: bold_english_sentence_v3
  prompt_dir: data/raw/prompts
  output_dir: data/generated
  expected_prompt_count: 23679
  prompt_mode: instruction_prefix
  instruction_prefix: |
    Complete the unfinished sentence below in English.
    Write only the words needed to finish that sentence naturally.
    Keep the completion concise and end with a full stop.
    Do not start another sentence.
    Do not repeat the given text, ask questions, or create a quiz.
    Output only the continuation.

    Unfinished sentence:
  empty_prompt_policy: preserve_and_skip
  repetitions: 1
  base_seed: 42
generation:
  do_sample: true
  temperature: 1.0
  top_k: 40
  top_p: 0.95
  repetition_penalty: 1.0
  max_new_tokens: 80
  sentence_stop: english_sentence_v1
runtime:
  batch_size: 8
  checkpoint_every_batches: 10
  attention_implementation: sdpa
quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: false
  compute_dtype: bfloat16
